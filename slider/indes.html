<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Image Slider</title>
    <script src="script.js" defer></script>
</head>
<body>
    
    <div class="slider">
        <div class="slides">

            <img class="slide" src="blue.jpg" alt="Blue Challenger Super Stock 2023- last call edition">          
            <img class="slide" src="red.jpg" alt="Red Challenger Super Stock 2023- last call edition">
            <img class="slide" src="white.jpg" alt="White Challenger Super Stock 2023- last call edition">

        </div>

        <button class="prev" onclick="prevSlide()">&#10094</button>
        <button class="next" onclick="nextSlide()">&#10095</button>

    </div>

</body>
</html>
