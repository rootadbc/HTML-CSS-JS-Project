    <form>

        <label for="principal">Interest Rates:</label>
        <input type="number" id="rate">
   
        <label for="principal">Years</label>

        <button type="button" onclick="calculate()">Submit</button>

        <!---
        
        // onclick="calculate()" = a section in JS (function) , that does and respond to the click of that button.
        
        -->

    </form>
