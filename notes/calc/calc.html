<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./calc.css">
    <script src="./calc.js" defer></script>
    <title>CALCULATOR</title>
</head>

<body>

    <div id="calculator">
        <!-- This is the whole frame of the calculator-->

        <input id="display" readonly>
        <!-- #input section, the readonly - makes it so that the input section will not take in any value - rather, it'll be used for only displaying  -->
        <div id="keys">
            <!-- this div section will hold our buttons-->
            <button onclick="appendToDisplay('+')" class="operatorbtn">+</button>
            <button class="sevenbtn" onclick="appendToDisplay('7')">7</button>
            <button class="eightbtn" onclick="appendToDisplay('8')">8</button>
            <button class="ninebtn" onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('-')" class="operatorbtn">-</button>
            <button class="fourbtn" onclick="appendToDisplay('4')">4</button>
            <button class="fivebtn" onclick="appendToDisplay('5')">5</button>
            <button class="sixbtn" onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('*')" class="operatorbtn">*</button>
            <button class="onebtn" onclick="appendToDisplay('1')">1</button>
            <button class="twobtn" onclick="appendToDisplay('2')">2</button>
            <button class="threebtn" onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('/')" class="operatorbtn">/</button>
            <button class="zerobtn" onclick="appendToDisplay('0')">0</button>
            <button class="decimalbtn" onclick="appendToDisplay('.')">.</button>
            <!-- onclick will be our js call to action -->
            <button class="equalsbtn" onclick="calculate()">=</button>
            <button class="clearbtn" onclick="clearDisplay()">C</button>

        </div>



    </div>

</body>

</html>
